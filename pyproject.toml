[project]
name = "sf-assistant-mcp"
version = "0.2.0"
description = "MCP Server for SAP SuccessFactors — employee queries, org structure, business rules, data import, and analytics"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]
gcp = [
    "google-cloud-secret-manager>=2.0.0",
]
frontend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "google-genai>=0.3",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["helpers", "models", "tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
